name: Version Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Run repo version guard
        run: make check-version

      - name: Run Terraform provider version guard
        run: ./terraform/kubernetes/scripts/check-provider-version.sh --execute

      - name: Run Kubernetes stack version guard in CI mode
        run: ./terraform/kubernetes/scripts/check-component-version.sh --execute --ci
