# The "remote" secret this demo reads back through External Secrets. In a real
# cluster this lives in a cloud secret manager; the Kubernetes provider is the
# maintained way to demonstrate the same flow without one.
apiVersion: v1
kind: Secret
metadata:
  name: eso-demo-source
  namespace: eso-demo
type: Opaque
stringData:
  api-key: local-kubernetes-provider-api-key
