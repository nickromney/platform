spec:
  endpointSelector:
    matchLabels:
      "k8s:io.kubernetes.pod.namespace": apim
      "k8s:app.kubernetes.io/name": subnetcalc-apim-simulator
      "k8s:tier": gateway
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
