apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-demo-reader
  namespace: eso-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-demo-reader
  namespace: eso-demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["eso-demo-source"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-demo-reader
  namespace: eso-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-demo-reader
subjects:
  - kind: ServiceAccount
    name: eso-demo-reader
    namespace: eso-demo
