name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The Linux job below is the full gate. This one exists because the primary
  # host is Linux while the platform is also run on macOS, and nothing else
  # validates that path: stock macOS ships Bash 3.2 and BSD awk rather than
  # Bash 5 and gawk, so a script can pass every Linux check and still be broken
  # there. Only the no-cluster, no-Docker, no-network subset runs here.
  host-portable-bats-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Bats and query tools
        run: |
          set -euo pipefail
          brew install bats-core jq yq

      - name: Record the interpreters under test
        # Recorded rather than asserted: the value is knowing which bash and awk
        # actually ran when a failure needs explaining.
        run: |
          set -euo pipefail
          /bin/bash --version | head -n 1
          awk --version 2>/dev/null | head -n 1 || awk -Wversion 2>&1 | head -n 1 || true

      - name: Run host-portable Bats subset
        run: make test-host-portable

  lint-and-hermetic-bats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install lint and Bats tools
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gzip \
            make \
            ripgrep \
            tar \
            unzip
          sudo rm -rf /var/lib/apt/lists/*

          source .devcontainer/toolchain-versions.sh

          tool_version() {
            local requested="$1"
            local entry
            for entry in "${DEVCONTAINER_ARKADE_TOOLS[@]}"; do
              if [[ "${entry%%=*}" == "${requested}" ]]; then
                printf '%s\n' "${entry#*=}"
                return 0
              fi
            done
            printf 'missing devcontainer tool version: %s\n' "${requested}" >&2
            exit 1
          }

          case "$(uname -m)" in
            x86_64|amd64)
              go_arch="amd64"
              kyverno_arch="x86_64"
              uv_arch="x86_64"
              ;;
            aarch64|arm64)
              go_arch="arm64"
              kyverno_arch="arm64"
              uv_arch="aarch64"
              ;;
            *)
              printf 'unsupported architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          uv_version="$(
            sed -nE 's#^COPY --from=ghcr.io/astral-sh/uv:([^ ]+).*#\1#p' \
              .devcontainer/Dockerfile
          )"
          curl -fsSL \
            "https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-${uv_arch}-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "${tmp_dir}"
          sudo install -m 0755 \
            "${tmp_dir}/uv-${uv_arch}-unknown-linux-gnu/uv" \
            /usr/local/bin/uv

          bats_version="1.13.0"
          curl -fsSL \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${bats_version}.tar.gz" \
            | tar -xz -C "${tmp_dir}"
          sudo "${tmp_dir}/bats-core-${bats_version}/install.sh" /usr/local

          kubectl_version="$(tool_version kubectl)"
          curl -fsSL \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${go_arch}/kubectl" \
            -o "${tmp_dir}/kubectl"
          sudo install -m 0755 "${tmp_dir}/kubectl" /usr/local/bin/kubectl

          jq_version="$(tool_version jq)"
          curl -fsSL \
            "https://github.com/jqlang/jq/releases/download/${jq_version}/jq-linux-${go_arch}" \
            -o "${tmp_dir}/jq"
          sudo install -m 0755 "${tmp_dir}/jq" /usr/local/bin/jq

          yq_version="$(tool_version yq)"
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${yq_version}/yq_linux_${go_arch}.tar.gz" \
            | tar -xz -C "${tmp_dir}" "./yq_linux_${go_arch}"
          sudo install -m 0755 \
            "${tmp_dir}/yq_linux_${go_arch}" \
            /usr/local/bin/yq

          kyverno_archive="kyverno-cli_${KYVERNO_VERSION}_linux_${kyverno_arch}.tar.gz"
          curl -fsSL \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/${kyverno_archive}" \
            | tar -xz -C "${tmp_dir}" kyverno
          sudo install -m 0755 "${tmp_dir}/kyverno" /usr/local/bin/kyverno

          uv tool install yamllint==1.38.0
          # make lint runs ruff over tests/app_contracts.py. Pinned rather than
          # tracking latest so the rule set cannot change under a PR, the same
          # reason ruff.toml states its selection explicitly.
          uv tool install ruff==0.16.2
          npm install --global markdownlint-cli2@0.22.1
          # biome and deno are what apps/*/Makefile js-check calls. Neither was
          # installed anywhere, so the browser JavaScript contracts skipped in CI
          # and could only ever be exercised on a workstation that happened to
          # have them. Pinned for the same reason as everything else here.
          npm install --global @biomejs/biome@2.5.8

          deno_version="2.9.5"
          curl -fsSL \
            "https://github.com/denoland/deno/releases/download/v${deno_version}/deno-${uv_arch}-unknown-linux-gnu.zip" \
            -o "${tmp_dir}/deno.zip"
          unzip -q -o "${tmp_dir}/deno.zip" -d "${tmp_dir}"
          sudo install -m 0755 "${tmp_dir}/deno" /usr/local/bin/deno

          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"

          bats --version
          kubectl version --client=true
          jq --version
          yq --version
          kyverno version
          yamllint --version
          ruff --version
          markdownlint-cli2 --version
          biome --version
          deno --version

      - name: Run repo lint
        run: make lint

      - name: Run hermetic Bats subset
        run: make test-ci
