# Backend ingress for the Cilium Gateway API data path. Rendered only when
# cilium_gateway_api is enabled; the NGINX Gateway Fabric path does not use it.
#
# Cilium terminates Gateway API traffic in its own Envoy rather than in a pod,
# and that Envoy presents the reserved:ingress identity -- not host, and not a
# platform-gateway pod identity. Measured on a two-node kind cluster, a Cilium
# Gateway reaching oauth2-proxy produced:
#
#   Policy denied ... identity ingress->48344: 10.244.0.166 -> 10.244.1.224:4180
#
# So every backend the gateway serves needs an explicit fromEntities: ingress
# rule. Each document below mirrors, one for one, an egress allowance that
# platform-gateway-hardened grants the NGINX gateway pods. The nginx-gateway
# control plane is deliberately absent: it does not exist in this mode.
#
# These are scoped per backend rather than written as a single empty
# endpointSelector, so the Cilium Envoy is admitted only where the NGINX
# gateway was already allowed to go.
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cilium-gateway-ingress-argocd
spec:
  endpointSelector:
    matchLabels:
      "k8s:io.kubernetes.pod.namespace": argocd
      "k8s:app.kubernetes.io/name": argocd-server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
