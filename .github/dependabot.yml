version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      major:
        patterns:
          - '*'
        update-types:
          - major
  - package-ecosystem: gomod
