# Backend ingress for the Cilium Gateway API data path. Cilium is the only
# Gateway API implementation, so these are always rendered.
#
# Cilium terminates Gateway API traffic in its own Envoy rather than in a pod,
# and that Envoy presents the reserved:ingress identity -- not host, and not a
# platform-gateway pod identity. Measured on a two-node kind cluster, a Cilium
# Gateway reaching oauth2-proxy produced:
#
#   Policy denied ... identity ingress->48344: 10.244.0.166 -> 10.244.1.224:4180
#
# So every backend the gateway serves needs an explicit fromEntities: ingress
# rule. Each document below mirrors, one for one, an egress allowance that
# platform-gateway-hardened grants the NGINX gateway pods. The nginx-gateway
# control plane is deliberately absent: it does not exist in this mode.
#
# These are scoped per backend rather than written as a single empty
# endpointSelector, so the Cilium Envoy is admitted only where the NGINX
# gateway was already allowed to go.
#
# Deliberately absent: hubble-ui and policy-reporter. In Cilium, selecting an
# endpoint in any policy switches it from default-allow to default-deny for that
# direction, so adding an allow rule to an otherwise-unselected endpoint REMOVES
# access rather than granting it. Both of those are unselected by any other
# ingress policy, so reserved:ingress already reaches them, and adding a rule
# here broke the node-to-NodePort path instead:
#
#   Policy denied ... identity kube-apiserver->14998: 172.18.0.3 -> 10.244.1.74:8081
#
# That is the control plane reaching Hubble UI's NodePort, which is what kind
# publishes to the host. Note the identity: the node hosting the apiserver
# presents reserved:kube-apiserver, not host, so even an explicit host rule
# would not have covered it. Every entry below selects an endpoint that some
# other policy already restricts, which is what makes these rules purely
# additive.
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cilium-gateway-ingress-argocd
spec:
  endpointSelector:
    matchLabels:
      "k8s:io.kubernetes.pod.namespace": argocd
      "k8s:app.kubernetes.io/name": argocd-server
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
