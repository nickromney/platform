apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: gateway-routes
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames:
    - mcp.127.0.0.1.sslip.io
    - mcpserver.dev.127.0.0.1.sslip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        - group: ""
          kind: Service
          name: subnetcalc-apim-simulator
          namespace: apim
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        - group: ""
          kind: Service
          name: subnetcalc-apim-simulator
          namespace: apim
          port: 8000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /a2a
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=63072000; includeSubDomains"
              - name: X-Content-Type-Options
                value: "nosniff"
              - name: X-Frame-Options
                value: "DENY"
              - name: Referrer-Policy
                value: "strict-origin-when-cross-origin"
      backendRefs:
        - group: ""
          kind: Service
          name: subnetcalc-apim-simulator
          namespace: apim
          port: 8000
          weight: 1
