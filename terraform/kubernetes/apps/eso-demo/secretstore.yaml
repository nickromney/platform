# The fake provider is marked unmaintained upstream, and External Secrets emits
# a StoreUnmaintained warning on every reconcile of a store that uses it. The
# kubernetes provider is maintained and demonstrates the same flow by reading a
# secret from this namespace as if it were a remote secret manager.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-demo-store
  namespace: eso-demo
spec:
  provider:
    kubernetes:
      remoteNamespace: eso-demo
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-demo-reader
