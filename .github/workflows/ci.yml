name: CI

# No pull_request trigger. The full gate runs locally instead: `make test-ci`
# stamps a receipt naming the tree it verified, and the pre-push hook refuses a
# push whose tree does not match it (scripts/ci-receipt.sh). That keeps the
# feedback loop off GitHub's queue, which is where the waiting was.
#
# What remains here is the evidence that local runs cannot produce: main is the
# protected line, and the macOS job covers Bash 3.2 and BSD awk from a Linux
# host. Run it against a branch on demand with:
#   gh workflow run ci.yml --ref <branch>
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The Linux job below is the full gate. This one exists because the primary
  # host is Linux while the platform is also run on macOS, and nothing else
  # validates that path: stock macOS ships Bash 3.2 and BSD awk rather than
  # Bash 5 and gawk, so a script can pass every Linux check and still be broken
  # there. Only the no-cluster, no-Docker, no-network subset runs here.
  host-portable-bats-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Bats and query tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail

          # The runner image arrives with third-party taps (aws/tap today).
          # Homebrew now requires per-tap trust and prints a ~15 line notice for
          # each untrusted one on every invocation, which buries the actual
          # install output. bats-core, jq and yq are all homebrew/core, so no
          # third-party tap can affect what is installed here -- drop them
          # rather than silencing the check with the deprecated
          # HOMEBREW_NO_REQUIRE_TAP_TRUST. The runner is ephemeral.
          while read -r tap; do
            case "${tap}" in
              homebrew/*) ;;
              "") ;;
              *) brew untap "${tap}" || true ;;
            esac
          done < <(brew tap)

          brew install bats-core jq yq

      - name: Record the interpreters under test
        # Recorded rather than asserted: the value is knowing which bash and awk
        # actually ran when a failure needs explaining.
        run: |
          set -euo pipefail
          /bin/bash --version | head -n 1
          awk --version 2>/dev/null | head -n 1 || awk -Wversion 2>&1 | head -n 1 || true

      - name: Run host-portable Bats subset
        run: make test-host-portable

  lint-and-hermetic-bats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      # tests/go-tests.bats runs every tracked Go module's suite -- ~9.5k lines
      # of tests that no CI job executed before. Pinned rather than taken from
      # the runner image, for the reason #202 pinned shellcheck. The version
      # tracks the `go` directive shared by all 17 go.mod files; tests/
      # ci-workflow.bats asserts the two stay equal.
      # cache-dependency-path is required, not optional: every go.mod in this
      # repo is nested under apps/ or tools/, and setup-go looks for one in the
      # workspace root. Without it the step logs "Dependencies file is not
      # found" and silently disables the module and build caches, so every run
      # re-downloads and re-builds all 18 modules.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.mod"

      - name: Install lint and Bats tools
        run: |
          set -euo pipefail

          # apt is the fallback, not the path. ubuntu-latest ships all of these,
          # and ripgrep -- the one tool the image lacks that the gate needs, in
          # ten Bats files -- comes from its pinned GitHub release below like
          # shellcheck and kyverno. That matters because `apt-get update` alone
          # has taken over six minutes here when the Azure mirror Ign:s and the
          # run falls back to archive.ubuntu.com.
          #
          # The check stays so a changed runner image surfaces as a named
          # install rather than a confusing failure later. Package names differ
          # from command names, hence the map.
          declare -A base_tools=(
            [curl]=curl
            [git]=git
            [gzip]=gzip
            [make]=make
            [tar]=tar
            [unzip]=unzip
          )
          missing_packages=()
          for command_name in "${!base_tools[@]}"; do
            command -v "${command_name}" >/dev/null 2>&1 ||
              missing_packages+=("${base_tools[${command_name}]}")
          done
          [[ -s /etc/ssl/certs/ca-certificates.crt ]] ||
            missing_packages+=(ca-certificates)

          if ((${#missing_packages[@]})); then
            printf 'installing missing base tools: %s\n' "${missing_packages[*]}"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing_packages[@]}"
            sudo rm -rf /var/lib/apt/lists/*
          else
            echo "OK   base tools already present on the runner image; skipping apt"
          fi

          source .devcontainer/toolchain-versions.sh

          tool_version() {
            local requested="$1"
            local entry
            for entry in "${DEVCONTAINER_ARKADE_TOOLS[@]}"; do
              if [[ "${entry%%=*}" == "${requested}" ]]; then
                printf '%s\n' "${entry#*=}"
                return 0
              fi
            done
            printf 'missing devcontainer tool version: %s\n' "${requested}" >&2
            exit 1
          }

          case "$(uname -m)" in
            x86_64|amd64)
              go_arch="amd64"
              kyverno_arch="x86_64"
              uv_arch="x86_64"
              shellcheck_arch="x86_64"
              ripgrep_target="x86_64-unknown-linux-musl"
              ;;
            aarch64|arm64)
              go_arch="arm64"
              kyverno_arch="arm64"
              uv_arch="aarch64"
              shellcheck_arch="aarch64"
              ripgrep_target="aarch64-unknown-linux-gnu"
              ;;
            *)
              printf 'unsupported architecture: %s\n' "$(uname -m)" >&2
              exit 1
              ;;
          esac

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          uv_version="$(
            sed -nE 's#^COPY --from=ghcr.io/astral-sh/uv:([^ ]+).*#\1#p' \
              .devcontainer/Dockerfile
          )"
          curl -fsSL \
            "https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-${uv_arch}-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "${tmp_dir}"
          sudo install -m 0755 \
            "${tmp_dir}/uv-${uv_arch}-unknown-linux-gnu/uv" \
            /usr/local/bin/uv

          bats_version="1.13.0"
          curl -fsSL \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${bats_version}.tar.gz" \
            | tar -xz -C "${tmp_dir}"
          sudo "${tmp_dir}/bats-core-${bats_version}/install.sh" /usr/local

          kubectl_version="$(tool_version kubectl)"
          curl -fsSL \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/${go_arch}/kubectl" \
            -o "${tmp_dir}/kubectl"
          sudo install -m 0755 "${tmp_dir}/kubectl" /usr/local/bin/kubectl

          jq_version="$(tool_version jq)"
          curl -fsSL \
            "https://github.com/jqlang/jq/releases/download/${jq_version}/jq-linux-${go_arch}" \
            -o "${tmp_dir}/jq"
          sudo install -m 0755 "${tmp_dir}/jq" /usr/local/bin/jq

          yq_version="$(tool_version yq)"
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${yq_version}/yq_linux_${go_arch}.tar.gz" \
            | tar -xz -C "${tmp_dir}" "./yq_linux_${go_arch}"
          sudo install -m 0755 \
            "${tmp_dir}/yq_linux_${go_arch}" \
            /usr/local/bin/yq

          # Pinned rather than apt-installed so no CI run pays for apt-get
          # update. Ten gated Bats files call rg; nothing else here needs apt.
          ripgrep_dir="ripgrep-${RIPGREP_VERSION}-${ripgrep_target}"
          curl -fsSL \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${ripgrep_dir}.tar.gz" \
            | tar -xz -C "${tmp_dir}" --strip-components=1 "${ripgrep_dir}/rg"
          sudo install -m 0755 "${tmp_dir}/rg" /usr/local/bin/rg

          # Pinned like every other tool here. Left to the runner image this was
          # 0.9.0, which emits SC2317 ("Command appears to be unreachable") where
          # 0.11.0 does not -- 449 findings that no local run could reproduce.
          shellcheck_archive="shellcheck-${SHELLCHECK_VERSION}.linux.${shellcheck_arch}.tar.xz"
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${shellcheck_archive}" \
            | tar -xJ -C "${tmp_dir}" --strip-components=1 \
              "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "${tmp_dir}/shellcheck" /usr/local/bin/shellcheck

          kyverno_archive="kyverno-cli_${KYVERNO_VERSION}_linux_${kyverno_arch}.tar.gz"
          curl -fsSL \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/${kyverno_archive}" \
            | tar -xz -C "${tmp_dir}" kyverno
          sudo install -m 0755 "${tmp_dir}/kyverno" /usr/local/bin/kyverno

          uv tool install yamllint==1.38.0
          # make lint runs ruff over tests/app_contracts.py. Pinned rather than
          # tracking latest so the rule set cannot change under a PR, the same
          # reason ruff.toml states its selection explicitly.
          uv tool install ruff==0.16.2
          npm install --global markdownlint-cli2@0.22.1
          # biome and deno are what apps/*/Makefile js-check calls. Neither was
          # installed anywhere, so the browser JavaScript contracts skipped in CI
          # and could only ever be exercised on a workstation that happened to
          # have them. Pinned for the same reason as everything else here.
          npm install --global @biomejs/biome@2.5.8

          deno_version="2.9.5"
          curl -fsSL \
            "https://github.com/denoland/deno/releases/download/v${deno_version}/deno-${uv_arch}-unknown-linux-gnu.zip" \
            -o "${tmp_dir}/deno.zip"
          unzip -q -o "${tmp_dir}/deno.zip" -d "${tmp_dir}"
          sudo install -m 0755 "${tmp_dir}/deno" /usr/local/bin/deno

          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"

          bats --version
          kubectl version --client=true
          jq --version
          yq --version
          kyverno version
          yamllint --version
          ruff --version
          shellcheck --version | sed -n 's/^version: /shellcheck /p'
          markdownlint-cli2 --version
          biome --version
          deno --version

      - name: Run repo lint
        run: make lint

      - name: Run hermetic Bats subset
        run: make test-ci
